<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密钥文件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #333;
        }

        /* 顶部导航 */
        .header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .cart-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .cart-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .cart-count {
            background: #ef4444;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 4px;
        }

        /* 容器 单个卡片居中 */
        .container {
            max-width: 1200px;
            margin: 60px auto 0;
            padding: 0 20px 40px;
            display: flex;
            justify-content: center;
        }

        .product-card {
            width: 100%;
            max-width: 360px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .product-img-wrap {
            width: 100%;
            height: 200px;
            overflow:hidden;
            position:relative;
        }
        .product-img {
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-desc {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 16px;
            line-height:1.6;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            color: #ef4444;
            font-size: 22px;
            font-weight: bold;
        }

        .buy-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .buy-btn:hover {
            background: #2563eb;
        }

        .stock {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 8px;
        }

        /* 购物车弹窗 */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .cart-modal.show {
            display: flex;
        }

        .cart-box {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
        }

        .cart-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .cart-item-name {
            flex: 1;
            font-size: 14px;
        }

        .cart-item-price {
            color: #ef4444;
            font-weight: 600;
            margin: 0 12px;
        }

        .num-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .num-btn {
            width: 24px;
            height: 24px;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .del-btn {
            color: #9ca3af;
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 8px;
        }

        .cart-footer {
            padding: 16px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-price {
            font-size: 18px;
            font-weight: bold;
            color: #ef4444;
        }

        .checkout-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .checkout-btn:hover {
            background: #059669;
        }

        .empty-cart {
            text-align: center;
            color: #9ca3af;
            padding: 40px 0;
        }

        /* 结算成功弹窗 自定义图片+文件区域 */
        .success-modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
            z-index:300;
            align-items:center;
            justify-content:center;
        }
        .success-modal.show{
            display:flex;
        }
        .success-card{
            background:#fff;
            width:90%;
            max-width:420px;
            border-radius:14px;
            overflow:hidden;
        }
        .success-img-wrap{
            width:100%;
            height:220px;
        }
        .success-img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .success-body{
            padding:20px;
        }
        .success-title{
            font-size:18px;
            font-weight:bold;
            text-align:center;
            margin-bottom:14px;
        }
        .file-box{
            background:#f7f8fa;
            padding:14px;
            border-radius:8px;
            margin-bottom:16px;
            word-break:break-all;
        }
        .close-success{
            width:100%;
            padding:10px;
            background:#3b82f6;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
        }

        @media (max-width: 640px) {
            .product-name {
                font-size: 14px;
            }
            .price {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <div class="logo">密钥文件</div>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 购物车 <span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</div>

<div class="container">
    <div class="product-card">
        <!-- 可以修改src更换商品图片 -->
        <div class="product-img-wrap">
            <img class="product-img" id="mainProductImg" src="https://picsum.photos/id/237/600/400" alt="商品图">
        </div>
        <div class="product-info">
            <div class="product-name">密钥文件资源</div>
            <div class="product-desc">全套密钥文件，下载即用，纯前端演示项目</div>
            <div class="product-bottom">
                <div class="price">¥5.00</div>
                <button class="buy-btn" onclick="addToCart(1)">加入购物车</button>
            </div>
            <div class="stock">库存：999 份</div>
        </div>
    </div>
</div>

<!-- 购物车弹窗 -->
<div class="cart-modal" id="cartModal" onclick="if(event.target===this)toggleCart()">
    <div class="cart-box">
        <div class="cart-header">
            <h3>我的购物车</h3>
            <button class="close-btn" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-list" id="cartList"></div>
        <div class="cart-footer">
            <div>合计：<span class="total-price" id="totalPrice">¥0.00</span></div>
            <button class="checkout-btn" onclick="checkout()">立即结算</button>
        </div>
    </div>
</div>

<!-- 结算成功弹窗【自定义图片+自定义文件文本】 -->
<div class="success-modal" id="successModal" onclick="if(event.target===this)closeSuccess()">
    <div class="success-card">
        <div class="success-img-wrap">
            <!-- 修改src替换结算弹窗图片 -->
            <img class="success-img" id="successPopupImg" src="https://picsum.photos/id/42/600/400" alt="结算图">
        </div>
        <div class="success-body">
            <div class="success-title">购买成功，获取资源</div>
            <!-- 修改这里fileContent内容，自定义显示的文件/密钥文本 -->
            <div class="file-box" id="fileContent">
key‑abc‑123‑demo‑xyz<br>
下载链接：demo‑file.test/file.zip
            </div>
            <button class="close-success" onclick="closeSuccess()">关闭</button>
        </div>
    </div>
</div>

<script>
    const products = [
        { id: 1, name: "密钥文件资源", desc: "全套密钥文件，下载即用，纯前端演示项目", price: 5.00, stock: 999 }
    ];

    let cart = JSON.parse(localStorage.getItem('cart') || '[]');

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const exist = cart.find(item => item.id === id);
        if (exist) {
            exist.num++;
        } else {
            cart.push({ ...product, num: 1 });
        }
        saveCart();
        updateCartCount();
        alert('已加入购物车');
    }

    function saveCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartCount() {
        const count = cart.reduce((sum, item) => sum + item.num, 0);
        document.getElementById('cartCount').textContent = count;
    }

    function toggleCart() {
        document.getElementById('cartModal').classList.toggle('show');
        renderCart();
    }

    function renderCart() {
        if (cart.length === 0) {
            document.getElementById('cartList').innerHTML = '<div class="empty-cart">购物车是空的~</div>';
            document.getElementById('totalPrice').textContent = '¥0.00';
            return;
        }
        const html = cart.map(item => `
            <div class="cart-item">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">¥${item.price.toFixed(2)}</div>
                <div class="num-control">
                    <button class="num-btn" onclick="changeNum(${item.id}, -1)">-</button>
                    <span>${item.num}</span>
                    <button class="num-btn" onclick="changeNum(${item.id}, 1)">+</button>
                    <button class="del-btn" onclick="delItem(${item.id})">删除</button>
                </div>
            </div>
        `).join('');
        document.getElementById('cartList').innerHTML = html;
        const total = cart.reduce((sum, item) => sum + item.price * item.num, 0);
        document.getElementById('totalPrice').textContent = '¥' + total.toFixed(2);
    }

    function changeNum(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.num += delta;
            if (item.num <= 0) {
                delItem(id);
                return;
            }
            saveCart();
            updateCartCount();
            renderCart();
        }
    }

    function delItem(id) {
        cart = cart.filter(item => item.id !== id);
        saveCart();
        updateCartCount();
        renderCart();
    }

    // 结算：关闭购物车，弹出成功卡片弹窗
    function checkout() {
        if (cart.length === 0) {
            alert('购物车是空的！');
            return;
        }
        // 关闭购物车
        document.getElementById('cartModal').classList.remove('show');
        // 弹出结算成功弹窗
        document.getElementById('successModal').classList.add('show');

        // 清空购物车
        cart = [];
        saveCart();
        updateCartCount();
        renderCart();
    }

    function closeSuccess(){
        document.getElementById('successModal').classList.remove('show');
    }

    updateCartCount();
</script>

</body>
</html>
