<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密钥文件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #333;
        }

        /* 顶部导航 */
        .header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .cart-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .cart-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        .cart-count {
            background: #ef4444;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 4px;
        }

        .container {
            max-width: 1200px;
            margin: 60px auto 0;
            padding: 0 20px 40px;
            display: flex;
            justify-content: center;
        }

        .product-card {
            width: 100%;
            max-width: 360px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.12);
        }

        .product-img-wrap {
            width: 100%;
            height: 200px;
            overflow:hidden;
            position:relative;
        }
        .product-img {
            width:100%;
            height:100%;
            object-fit:cover;
            transition: transform 0.4s ease;
        }
        .product-card:hover .product-img{
            transform: scale(1.05);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-desc {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 16px;
            line-height:1.6;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            color: #ef4444;
            font-size: 22px;
            font-weight: bold;
        }

        .buy-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .buy-btn:hover {
            background: #2563eb;
            transform: scale(1.03);
        }
        .buy-btn:active{
            transform: scale(0.98);
        }

        .stock {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 8px;
        }

        /* 弹窗通用动画 */
        .modal-mask{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0);
            z-index: 200;
            align-items: center;
            justify-content: center;
            transition: background 0.35s ease;
        }
        .modal-mask.show{
            display:flex;
            background: rgba(0,0,0,0.55);
        }
        .modal-box{
            transform: scale(0.92) translateY(12px);
            opacity:0;
            transition: all 0.35s cubic‑bezier(0.25,0.8,0.25,1);
        }
        .modal-mask.show .modal-box{
            transform: scale(1) translateY(0);
            opacity:1;
        }

        /* 购物车弹窗 */
        .cart-box {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.2s ease;
        }
        .close-btn:hover{
            color:#111;
        }

        .cart-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .cart-item-name {
            flex: 1;
            font-size: 14px;
        }

        .cart-item-price {
            color: #ef4444;
            font-weight: 600;
            margin: 0 12px;
        }

        .num-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .num-btn {
            width: 24px;
            height: 24px;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition:all 0.2s ease;
        }
        .num-btn:hover{
            background:#f3f4f6;
        }

        .del-btn {
            color: #9ca3af;
            background: none;
            border: none;
            cursor: pointer;
            margin-left: 8px;
            transition:color 0.2s;
        }
        .del-btn:hover{
            color:#ef4444;
        }

        .cart-footer {
            padding: 16px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-price {
            font-size: 18px;
            font-weight: bold;
            color: #ef4444;
        }

        .checkout-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.3s ease,transform 0.2s ease;
        }
        .checkout-btn:hover {
            background: #059669;
            transform:scale(1.02);
        }
        .checkout-btn:active{
            transform:scale(0.98);
        }

        .empty-cart {
            text-align: center;
            color: #9ca3af;
            padding: 40px 0;
        }

        /* 付款弹窗 */
        .success-card{
            background:#fff;
            width:90%;
            max-width:420px;
            border-radius:14px;
            overflow:hidden;
        }
        .success-img-wrap{
            width:100%;
            height:220px;
            overflow:hidden;
        }
        .success-img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .success-body{
            padding:20px;
        }
        .success-title{
            font-size:18px;
            font-weight:bold;
            text-align:center;
            margin-bottom:14px;
        }
        .file-box{
            background:#f7f8fa;
            padding:14px;
            border-radius:8px;
            margin-bottom:16px;
            word-break:break-all;
            font-size:14px;
            line-height:1.6;
        }
        .close-success{
            width:100%;
            padding:10px;
            background:#3b82f6;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
            transition:background 0.3s ease;
        }
        .close-success:hover{
            background:#2563eb;
        }
        .open‑card‑btn{
            width:100%;
            padding:10px;
            background:#10b981;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
            margin-bottom:12px;
            transition:background 0.3s ease;
        }
        .open‑card‑btn:hover{
            background:#059669;
        }

        /* 卡密输入弹窗 */
        .keymodal-card{
            background:#ffffff;
            width:90%;
            max-width:380px;
            border-radius:12px;
            padding:24px;
        }
        .key-title{
            font-size:17px;
            font-weight:bold;
            text-align:center;
            margin-bottom:16px;
        }
        .key-input{
            width:100%;
            padding:12px 14px;
            border:1px solid #d1d5db;
            border-radius:8px;
            font-size:15px;
            margin-bottom:14px;
        }
        .key-input:focus{
            outline:none;
            border-color:#3b82f6;
        }
        .key-tip{
            font-size:13px;
            color:#ef4444;
            min-height:20px;
            margin-bottom:14px;
            text-align:center;
        }
        .key-btn-group{
            display:flex;
            gap:10px;
        }
        .key-confirm{
            flex:1;
            padding:10px;
            border:none;
            border-radius:8px;
            background:#3b82f6;
            color:#fff;
            cursor:pointer;
        }
        .key-cancel{
            flex:1;
            padding:10px;
            border:1px solid #d1d5db;
            border-radius:8px;
            background:#fff;
            cursor:pointer;
        }

        /* 成功解析卡密后展示文件弹窗 */
        .file‑result‑card{
            background:#fff;
            width:90%;
            max-width:400px;
            border-radius:12px;
            padding:24px;
        }
        .file‑result‑title{
            text-align:center;
            font-size:17px;
            font-weight:bold;
            margin-bottom:14px;
        }
        .file‑result‑content{
            background:#f7f8fa;
            padding:14px;
            border-radius:8px;
            font-size:14px;
            line-height:1.6;
            word-break:break-all;
            margin-bottom:16px;
        }
        .download-real-btn{
            width:100%;
            padding:11px;
            background:#10b981;
            color:white;
            border:none;
            border-radius:8px;
            font-size:15px;
            cursor:pointer;
            margin-bottom:10px;
            transition:background 0.3s ease;
        }
        .download-real-btn:hover{
            background:#059669;
        }

        /* 底部版权 */
        .copyright{
            text-align:center;
            padding:24px 12px;
            font-size:13px;
            color:#888;
        }

        @media (max-width: 640px) {
            .product-name {
                font-size: 14px;
            }
            .price {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <div class="logo">密钥文件</div>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 购物车 <span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</div>

<div class="container">
    <div class="product-card">
        <div class="product-img-wrap">
            <img class="product-img" id="mainProductImg" src="https://picsum.photos/id/237/600/400" alt="商品图">
        </div>
        <div class="product-info">
            <div class="product-name">密钥文件资源</div>
            <div class="product-desc">全套密钥文件，下载即用，纯前端演示项目</div>
            <div class="product-bottom">
                <div class="price">¥5.00</div>
                <button class="buy-btn" onclick="addToCart(1)">加入购物车</button>
            </div>
            <div class="stock">库存：999 份</div>
        </div>
    </div>
</div>

<!-- 购物车弹窗 -->
<div class="modal-mask" id="cartModal" onclick="if(event.target===this)toggleCart()">
    <div class="modal-box cart-box">
        <div class="cart-header">
            <h3>我的购物车</h3>
            <button class="close-btn" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-list" id="cartList"></div>
        <div class="cart-footer">
            <div>合计：<span class="total-price" id="totalPrice">¥0.00</span></div>
            <button class="checkout-btn" onclick="checkout()">立即结算</button>
        </div>
    </div>
</div>

<!-- 付款弹窗 -->
<div class="modal-mask" id="payModal" onclick="if(event.target===this)closePayModal()">
    <div class="modal-box success-card">
        <div class="success-img-wrap">
            <img class="success-img" id="popupPayImg" src="https://picsum.photos/id/42/600/400" alt="付款">
        </div>
        <div class="success-body">
            <div class="success-title">请付款</div>
            <div class="file-box" id="popupFileText">
请完成付款后获取资源<br>
演示文件路径：./download/secret.zip
            </div>
            <button class="open‑card‑btn" onclick="openKeyInputModal()">输入卡密提取文件</button>
            <button class="close-success" onclick="closePayModal()">关闭</button>
        </div>
    </div>
</div>

<!-- 卡密输入弹窗 -->
<div class="modal-mask" id="keyInputModal" onclick="if(event.target===this)closeKeyInputModal()">
    <div class="modal-box keymodal-card">
        <div class="key-title">请输入提取卡密</div>
        <input class="key-input" id="cardKeyInput" placeholder="在此输入卡密">
        <div class="key-tip" id="keyTip"></div>
        <div class="key-btn-group">
            <button class="key-cancel" onclick="closeKeyInputModal()">取消</button>
            <button class="key-confirm" onclick="verifyCardKey()">确认验证</button>
        </div>
    </div>
</div>

<!-- 卡密验证成功，展示文件弹窗【方案A：服务器真实文件下载】 -->
<div class="modal-mask" id="fileResultModal" onclick="if(event.target===this)closeFileResultModal()">
    <div class="modal-box file‑result‑card">
        <div class="file‑result‑title">✅文件提取成功</div>
        <div class="file‑result‑content" id="fileResultContent"></div>
        <button class="download-real-btn" onclick="triggerServerDownload()">📥下载服务器文件</button>
        <button class="close-success" onclick="closeFileResultModal()">关闭</button>
    </div>
</div>

<!-- 版权信息 -->
<div class="copyright">
© 版权所有 归属毁约
</div>

<script>
    // =====================【方案A 配置区】=====================
    const validCardKey = "DEMO‑KEY‑0001";
    // 👉这里填服务器上真实文件的相对URL，把文件上传到网站该路径
    const serverDownloadUrl = "./download/secret.zip";
    const outputFileContent = `
文件名：secret.zip
服务器路径：/download/secret.zip
请点击下方按钮下载文件
`;
    // =========================================================

    const products = [
        { id: 1, name: "密钥文件资源", desc: "全套密钥文件，下载即用，纯前端演示项目", price: 5.00, stock: 999 }
    ];

    let cart = JSON.parse(localStorage.getItem('cart') || '[]');

    // 触发服务器文件下载函数（方案A核心）
    function triggerServerDownload(){
        const a = document.createElement('a');
        a.href = serverDownloadUrl;
        a.target = "_blank";
        a.setAttribute("download","secret.zip");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const exist = cart.find(item => item.id === id);
        if (exist) {
            exist.num++;
        } else {
            cart.push({ ...product, num: 1 });
        }
        saveCart();
        updateCartCount();
        alert('已加入购物车');
    }

    function saveCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartCount() {
        const count = cart.reduce((sum, item) => sum + item.num, 0);
        document.getElementById('cartCount').textContent = count;
    }

    function toggleCart() {
        document.getElementById('cartModal').classList.toggle('show');
        renderCart();
    }

    function renderCart() {
        if (cart.length === 0) {
            document.getElementById('cartList').innerHTML = '<div class="empty-cart">购物车是空的~</div>';
            document.getElementById('totalPrice').textContent = '¥0.00';
            return;
        }
        const html = cart.map(item => `
            <div class="cart-item">
                <div class="cart-item-name">${item.name}</div>
                <div class="cart-item-price">¥${item.price.toFixed(2)}</div>
                <div class="num-control">
                    <button class="num-btn" onclick="changeNum(${item.id}, -1)">-</button>
                    <span>${item.num}</span>
                    <button class="num-btn" onclick="changeNum(${item.id}, 1)">+</button>
                    <button class="del-btn" onclick="delItem(${item.id})">删除</button>
                </div>
            </div>
        `).join('');
        document.getElementById('cartList').innerHTML = html;
        const total = cart.reduce((sum, item) => sum + item.price * item.num, 0);
        document.getElementById('totalPrice').textContent = '¥' + total.toFixed(2);
    }

    function changeNum(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.num += delta;
            if (item.num <= 0) {
                delItem(id);
                return;
            }
            saveCart();
            updateCartCount();
            renderCart();
        }
    }

    function delItem(id) {
        cart = cart.filter(item => item.id !== id);
        saveCart();
        updateCartCount();
        renderCart();
    }

    function checkout() {
        if (cart.length === 0) {
            alert('购物车是空的！');
            return;
        }
        document.getElementById('cartModal').classList.remove('show');
        document.getElementById('payModal').classList.add('show');
        cart = [];
        saveCart();
        updateCartCount();
        renderCart();
    }

    function closePayModal(){
        document.getElementById('payModal').classList.remove('show');
    }

    function openKeyInputModal(){
        document.getElementById('cardKeyInput').value = "";
        document.getElementById('keyTip').innerText = "";
        document.getElementById('keyInputModal').classList.add('show');
    }
    function closeKeyInputModal(){
        document.getElementById('keyInputModal').classList.remove('show');
    }

    function verifyCardKey(){
        const inputVal = document.getElementById('cardKeyInput').value.trim();
        const tipDom = document.getElementById('keyTip');
        if(!inputVal){
            tipDom.innerText = "请输入卡密！";
            return;
        }
        if(inputVal === validCardKey){
            closeKeyInputModal();
            document.getElementById('fileResultContent').innerText = outputFileContent;
            document.getElementById('fileResultModal').classList.add('show');
        }else{
            tipDom.innerText = "卡密错误，请核对！";
        }
    }

    function closeFileResultModal(){
        document.getElementById('fileResultModal').classList.remove('show');
    }

    updateCartCount();
</script>

</body>
</html>
